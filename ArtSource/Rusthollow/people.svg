      <path d="M74 30l-7 3 2 13 8 5m46-21 7 3-2 13-8 5" fill="url(#skin)" stroke="#573d33" stroke-width="3"/>
      <path d="M78 53l8 6m29-6-8 6" stroke="#dfbd91" stroke-width="3"/>
      <path d="M84 19q14-7 30 1m-28 3 6-3m18 4 5-2" fill="none" stroke="#695045" stroke-width="2"/>
