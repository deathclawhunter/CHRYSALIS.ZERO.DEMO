      <use href="#legL" transform="rotate(18 84 158)"/>
      <use href="#legR" transform="rotate(-17 112 158)"/>
      <use href="#body" transform="translate(0 -1)"/>
      <use href="#armL" transform="rotate(-17 73 74)"/>
      <use href="#armR" transform="rotate(15 118 74)"/>
      <use href="#rifle"/>
    </g>
    <g id="run1">
