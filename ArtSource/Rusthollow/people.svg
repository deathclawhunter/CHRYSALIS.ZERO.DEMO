      <use href="#body" transform="translate(1 0)"/>
      <use href="#armL" transform="rotate(-22 73 74)"/>
      <use href="#armR" transform="rotate(22 118 74)"/>
      <use href="#rifle" transform="rotate(-5 110 107)"/>
      <use href="#muzzle"/>
