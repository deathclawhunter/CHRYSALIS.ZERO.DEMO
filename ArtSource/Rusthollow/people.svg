      <use href="#legL" transform="rotate(-15 84 158)"/>
      <use href="#legR" transform="rotate(11 112 158)"/>
      <use href="#body" transform="rotate(-5 96 114)"/>
      <use href="#armL" transform="rotate(-12 73 74)"/>
      <use href="#armR" transform="rotate(32 118 74)"/>
      <use href="#knife"/>
