    <g transform="translate(192 0)"><use href="#walk1"/></g>
    <g transform="translate(384 0)"><use href="#walk2"/></g>
    <g transform="translate(576 0)"><use href="#run1"/></g>
    <g transform="translate(0 256)"><use href="#run2"/></g>
    <g transform="translate(192 256)"><use href="#shoot1"/></g>
    <g transform="translate(384 256)"><use href="#shoot2"/></g>
    <g transform="translate(576 256)"><use href="#attack"/></g>
  </g>
  <g style="--jacket:#884f3d;--jacketShade:#512f2d;--vest:#78633c">
    <g transform="translate(0 512)"><use href="#idle"/></g>
    <g transform="translate(192 512)"><use href="#walk1"/></g>
    <g transform="translate(384 512)"><use href="#walk2"/></g>
    <g transform="translate(576 512)"><use href="#run1"/></g>
    <g transform="translate(0 768)"><use href="#run2"/></g>
    <g transform="translate(192 768)"><use href="#shoot1"/></g>
    <g transform="translate(384 768)"><use href="#shoot2"/></g>
    <g transform="translate(576 768)"><use href="#attack"/></g>
  </g>
</svg>
