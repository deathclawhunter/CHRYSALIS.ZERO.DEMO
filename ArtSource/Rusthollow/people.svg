      <path d="M79 152h32m-31 6h30" stroke="#d1af72" stroke-width="3"/>
      <path d="M95 143v24m-3-15 5 4 5-4" fill="none" stroke="#252821" stroke-width="3"/>
      <path d="M91 166l-3 15 9 4 7-4-4-15z" fill="url(#skin)" stroke="#4a332a" stroke-width="3"/>
      <path d="M74 81l-8 24 8 7m49-31 9 24-9 7" fill="none" stroke="#d1c09a" stroke-width="3" opacity=".65"/>
