<svg xmlns="http://www.w3.org/2000/svg" width="768" height="1024" viewBox="0 0 768 1024">
  <defs>
    <linearGradient id="skin" x2="1" y2="1">
      <stop stop-color="#f0c49d"/><stop offset=".48" stop-color="#bd805f"/><stop offset="1" stop-color="#694436"/>
    </linearGradient>
    <linearGradient id="pants" x2="1" y2="1">
      <stop stop-color="#69736b"/><stop offset=".48" stop-color="#3d4945"/><stop offset="1" stop-color="#202b2a"/>
    </linearGradient>
    <linearGradient id="jacket" x2="1" y2="1">
      <stop stop-color="#798279"/><stop offset=".46" stop-color="#4c5751"/><stop offset="1" stop-color="#2a3432"/>
    </linearGradient>
    <linearGradient id="vest" x2="1" y2="1">
      <stop stop-color="#b49361"/><stop offset=".45" stop-color="#79603d"/><stop offset="1" stop-color="#41372a"/>
    </linearGradient>
    <linearGradient id="rifle" x2="0" y2="1">
