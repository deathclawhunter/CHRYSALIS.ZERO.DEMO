      <use href="#legL" transform="rotate(-34 84 158) translate(-3 -2)"/>
      <use href="#legR" transform="rotate(32 112 158) translate(2 -2)"/>
      <use href="#body" transform="translate(0 -5) rotate(-5 96 114)"/>
      <use href="#armL" transform="rotate(27 73 74)"/>
      <use href="#armR" transform="rotate(-28 118 74)"/>
      <use href="#rifle" transform="translate(0 -3)"/>
    </g>
    <g id="run2">
