<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="wall" x2="0" y2="1">
      <stop stop-color="#30383a"/>
      <stop offset=".58" stop-color="#555044"/>
      <stop offset="1" stop-color="#282827"/>
    </linearGradient>
    <linearGradient id="floor" x2=".12" y2="1">
      <stop stop-color="#6b6253"/>
      <stop offset=".4" stop-color="#514b41"/>
      <stop offset="1" stop-color="#343331"/>
    </linearGradient>
    <linearGradient id="neon" x2="1">
      <stop stop-color="#f2b966"/>
      <stop offset=".5" stop-color="#ffe2a0"/>
      <stop offset="1" stop-color="#e28748"/>
    </linearGradient>
    <linearGradient id="window" x2="0" y2="1">
      <stop stop-color="#314a56"/>
      <stop offset=".5" stop-color="#14242c"/>
      <stop offset="1" stop-color="#101619"/>
    </linearGradient>
    <pattern id="brick" width="126" height="58" patternUnits="userSpaceOnUse">
      <rect width="126" height="58" fill="#51483c"/>
      <path d="M0 1h126M0 57h126M62 1v28M0 29h126M123 29v28" fill="none" stroke="#262725" stroke-width="5"/>
      <path d="M4 5h53M68 5h52M4 34h54M67 34h54" stroke="#796851" stroke-width="2" opacity=".58"/>
      <path d="M10 15l15 2m49 25 24-2m-71 6 13-1" stroke="#342e29" stroke-width="3" opacity=".7"/>
    </pattern>
    <pattern id="tile" width="120" height="100" patternUnits="userSpaceOnUse">
      <rect width="120" height="100" fill="url(#floor)"/>
      <path d="M0 2h120M2 0v100M118 0v100M0 98h120" fill="none" stroke="#262725" stroke-width="5"/>
      <path d="M8 9h101M8 9v79" fill="none" stroke="#82745f" stroke-width="2" opacity=".5"/>
      <path d="M16 82l20-4m39-60 21 3m-54 42 10-1" stroke="#2b2925" stroke-width="4" opacity=".6"/>
      <circle cx="92" cy="73" r="2" fill="#a19070" opacity=".5"/>
    </pattern>
    <filter id="softShadow" x="-.25" y="-.25" width="1.5" height="1.5">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
    <filter id="glow" x="-.8" y="-.8" width="2.6" height="2.6">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="vignette">
      <stop offset=".52" stop-color="#080b0c" stop-opacity="0"/>
      <stop offset="1" stop-color="#080b0c" stop-opacity=".48"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="#161a1b"/>
  <rect x="34" y="24" width="1852" height="1032" rx="8" fill="#17191a" stroke="#121414" stroke-width="20"/>

  <!-- Back wall: cracked plaster, salvaged sheet metal, and old brick. -->
  <rect x="68" y="48" width="1784" height="214" fill="url(#wall)"/>
  <path d="M68 48h1784v203H68z" fill="url(#brick)" opacity=".42"/>
  <path d="M68 51h1784v36H68z" fill="#292e2d" opacity=".65"/>
  <path d="M68 223h1784v44H68z" fill="#272927"/>
