    <path d="M1039 47v47m-31 0h62l-10 23h-42z" fill="#2b2b26" stroke="#c28c54" stroke-width="4"/>
    <path d="M1542 47v47m-27 0h54l-9 22h-36z" fill="#2b2b26" stroke="#c28c54" stroke-width="4"/>
    <circle cx="517" cy="110" r="6" fill="#ffd48d" filter="url(#glow)"/>
    <circle cx="1039" cy="111" r="7" fill="#ffd48d" filter="url(#glow)"/>
    <circle cx="1542" cy="109" r="6" fill="#ffd48d" filter="url(#glow)"/>
  </g>

  <!-- Worn tile floor, scuffs, stains, cracks, and a patched floor drain. -->
  <rect x="68" y="258" width="1784" height="778" fill="url(#tile)"/>
  <path d="M68 258h1784v778H68z" fill="none" stroke="#151718" stroke-width="22"/>
  <path d="M86 285h1748M86 1030h1748M88 285v744m1744-744v744" fill="none" stroke="#242523" stroke-width="9" opacity=".85"/>
