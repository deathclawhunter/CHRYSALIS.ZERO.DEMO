  </g>
  <rect x="929" y="882" width="82" height="62" rx="5" fill="#242522" stroke="#514b3f" stroke-width="7"/>
  <path d="M941 893h58m-58 12h58m-58 12h58m-58 12h58" stroke="#71634f" stroke-width="3"/>
  <path d="M103 1012h1713" stroke="#b37c48" stroke-width="6" opacity=".45"/>
  <path d="M70 260h1780v776H70z" fill="url(#vignette)"/>
</svg>
