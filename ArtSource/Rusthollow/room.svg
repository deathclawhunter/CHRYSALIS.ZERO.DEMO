  <!-- Grimy reinforced window and bent bars. -->
  <rect x="123" y="89" width="294" height="111" rx="4" fill="#161c1d" stroke="#8b7654" stroke-width="11"/>
  <rect x="137" y="101" width="266" height="86" fill="url(#window)"/>
  <path d="M137 164q39-28 74-8t76-11 116 6v36H137z" fill="#293735"/>
  <path d="M147 119h241M147 145h241m-159-38v79m83-79v79" stroke="#141819" stroke-width="9"/>
  <path d="M142 107l36-5 8 8m192 76-22-12" fill="none" stroke="#c28b4f" stroke-width="4" opacity=".65"/>
  <path d="M155 176q24-18 48-7m120-55 21 13" fill="none" stroke="#9eb8b6" stroke-width="3" opacity=".4"/>

  <!-- Neon sign over the cantina bar. -->
  <rect x="633" y="64" width="616" height="122" rx="12" fill="#1c1d19" stroke="#977449" stroke-width="7"/>
  <rect x="649" y="79" width="584" height="91" rx="7" fill="#26211b" stroke="#433629" stroke-width="4"/>
  <text x="941" y="136" text-anchor="middle" font-family="Georgia,serif" font-size="52" font-weight="bold" letter-spacing="7" fill="url(#neon)" stroke="#ffb05d" stroke-width="1" filter="url(#glow)">THE RUSTED HALO</text>
  <text x="941" y="158" text-anchor="middle" font-family="sans-serif" font-size="12" letter-spacing="6" fill="#7b9b97">COLD DRINKS / HOT LEADS / NO QUESTIONS</text>
  <path d="M650 92h-16v60h16m584-60h16v60h-16" fill="none" stroke="#e9b46b" stroke-width="4"/>
  <circle cx="666" cy="94" r="4" fill="#f3c26f"/><circle cx="1217" cy="94" r="4" fill="#f3c26f"/>

  <!-- Hand-painted bounty board, old wall clock, ducting, and notices. -->
  <rect x="1430" y="86" width="274" height="114" rx="4" fill="#332920" stroke="#927147" stroke-width="8"/>
  <rect x="1443" y="98" width="247" height="88" fill="#b9a17a"/>
  <path d="M1454 109h123m-123 15h208m-208 16h189m-189 16h207m-205 15h126" stroke="#433c31" stroke-width="4" opacity=".75"/>
  <path d="M1460 112l8-5 5 5m57 13 9-5 8 5m-17 26 8-5 8 5m45-14 8-5 8 5" fill="#a14738" stroke="#7b352c" stroke-width="2"/>
  <circle cx="1782" cy="116" r="37" fill="#2a2a27" stroke="#9b7c4c" stroke-width="7"/>
  <circle cx="1782" cy="116" r="27" fill="#b9a77f"/>
  <path d="M1782 94v23l16 8" fill="none" stroke="#302a22" stroke-width="4"/>
  <path d="M446 49h17v133h-17m1180-133h16v128h-16" fill="none" stroke="#987445" stroke-width="12"/>
  <path d="M468 60h34v15h-34m1120-5h35v15h-35" fill="#ae7845"/>
  <path d="M79 244h1762" stroke="#101313" stroke-width="13"/>

  <!-- Ceiling pipes cast warm, broken pools of light onto the room. -->
  <path d="M90 39h1740M90 39v-10m310 10v-10m305 10v-10m315 10v-10m315 10v-10m300 10v-10" fill="none" stroke="#171a19" stroke-width="15"/>
  <g opacity=".8">
    <ellipse cx="517" cy="300" rx="110" ry="78" fill="#e1a55d" opacity=".10"/>
    <ellipse cx="1040" cy="305" rx="128" ry="85" fill="#e1a55d" opacity=".12"/>
    <ellipse cx="1544" cy="305" rx="120" ry="82" fill="#e1a55d" opacity=".09"/>
  </g>
  <g>
