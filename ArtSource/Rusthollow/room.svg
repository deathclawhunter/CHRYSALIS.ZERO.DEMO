  <path d="M92 101l32 14-18 25 26 18-11 38m249-145-10 45 18 17-28 26 9 29m383-97 19 25-16 31 30 18-18 36m336-126-7 32 19 13-10 29 24 30m327-81-21 17 10 29-19 18 12 35" fill="none" stroke="#1b1d1b" stroke-width="8" opacity=".64"/>
